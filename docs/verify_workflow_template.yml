name: Verify Polybrutus D15 exact certificate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install symbolic exact mathematics
        run: python -m pip install sympy==1.14.0
      - name: Verify D15 exact metric, minimal rank and selected graph spectrum
        run: python src/verify_d15.py
      - name: Independently verify 190 rational metric pairs and eigenvalue multiplicities
        run: python tests/independent_d15.py
